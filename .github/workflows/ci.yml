# Somnia — CI/CD Pipeline
# Tests → Deploy API → Deploy Dashboard

name: Somnia CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.10"
  HF_SPACE_API:   "marinedde/somnia-api"
  HF_SPACE_DASH:  "marinedde/somnia-dashboard"

jobs:

  # ── Job 1 : Tests ────────────────────────────────────────────────────────
  test:
    name: Tests & Qualité
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
          # PyTorch en version CPU : les tests des réseaux (données synthétiques) tournent aussi en CI.
          # Il n'entre pas dans requirements.txt : l'API déployée n'en a pas besoin.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Create dummy models for tests
        run: |
          python - << 'PYEOF'
          import joblib, numpy as np
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.ensemble import RandomForestClassifier
          from pathlib import Path

          Path('models').mkdir(exist_ok=True)

          pipe_eeg = Pipeline([
              ('scaler', StandardScaler()),
              ('clf', RandomForestClassifier(n_estimators=2, random_state=42))
          ])
          X = np.random.randn(50, 16)
          pipe_eeg.fit(X, np.random.randint(0, 5, 50))
          joblib.dump(pipe_eeg, 'models/somnia_eeg_pipeline.joblib')

          pipe_ecg = Pipeline([
              ('scaler', StandardScaler()),
              ('clf', RandomForestClassifier(n_estimators=2, random_state=42))
          ])
          pipe_ecg.fit(X, np.random.randint(0, 2, 50))
          joblib.dump(pipe_ecg, 'models/somnia_ecg_pipeline.joblib')

          print('Dummy models crees')
          PYEOF

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v \
            --tb=short

      - name: Vérifier script de réentraînement (dry-run)
        run: python python_scripts/retrain.py --dry-run

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Job 2 : Build Docker (desactive — a reactiver apres validation) ──────
  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies for dummy models
        run: pip install joblib scikit-learn numpy

      - name: Create dummy models for build
        run: |
          python - << 'PYEOF'
          import joblib, numpy as np
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.ensemble import RandomForestClassifier
          from pathlib import Path

          Path('models').mkdir(exist_ok=True)
          pipe = Pipeline([('scaler', StandardScaler()),
                           ('clf', RandomForestClassifier(n_estimators=2))])
          X = np.random.randn(20, 16)
          pipe.fit(X, np.random.randint(0, 5, 20))
          joblib.dump(pipe, 'models/somnia_eeg_pipeline.joblib')
          pipe.fit(X, np.random.randint(0, 2, 20))
          joblib.dump(pipe, 'models/somnia_ecg_pipeline.joblib')
          print('Dummy models crees')
          PYEOF

      - name: Build Docker image
        run: |
          docker build -t somnia-api:latest .
          echo "Docker build OK"

      - name: Test Docker container
        run: |
          docker run -d --name somnia-test -p 7860:7860 somnia-api:latest
          sleep 15
          curl -f http://localhost:7860/health || (docker logs somnia-test && exit 1)
          docker stop somnia-test
          echo "Container health check OK"

  # ── Job 3 : Deploy API → HuggingFace ────────────────────────────────────
  deploy-api:
    name: Deploy API → HuggingFace
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS objects (real model binaries)
        run: git lfs pull

      - name: Vérifier les modèles (.joblib LFS)
        run: |
          for f in models/somnia_eeg_pipeline.joblib models/somnia_ecg_pipeline.joblib; do
            size=$(wc -c < "$f" | tr -d ' ')
            echo "$f : ${size} octets"
            if [ "$size" -lt 1000000 ]; then
              echo "ERREUR: $f trop petit — Git LFS non récupéré (fichier pointer)."
              exit 1
            fi
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy API to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Liste blanche + suppression du reste : voir python_scripts/deploy_hf.py
        run: python python_scripts/deploy_hf.py api

  # ── Job 4 : Deploy Dashboard → HuggingFace ──────────────────────────────
  deploy-dashboard:
    name: Deploy Dashboard → HuggingFace
    runs-on: ubuntu-latest
    needs: [ test, deploy-api ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy Dashboard to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Liste blanche + suppression du reste : voir python_scripts/deploy_hf.py
        run: python python_scripts/deploy_hf.py dashboard

  # ── Notification ─────────────────────────────────────────────────────────
  notify:
    name: Resume deploiement
    runs-on: ubuntu-latest
    needs: [ deploy-api, deploy-dashboard ]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Resume
        run: |
          echo "Somnia - Deploiement termine"
          echo "API       : https://huggingface.co/spaces/${{ env.HF_SPACE_API }}"
          echo "Dashboard : https://huggingface.co/spaces/${{ env.HF_SPACE_DASH }}"
